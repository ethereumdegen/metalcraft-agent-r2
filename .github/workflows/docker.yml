name: build-and-push
# GHCR image build for metalcraft-agent-r2 (fork).

# Builds the daemon image on GitHub's runners and pushes it to GHCR so the VPS
# never has to compile Rust. Triggers:
#   - push to master       -> tags `latest`, the git sha, AND the Cargo.toml
#                             version (e.g. 0.11.0) so bumping the crate version
#                             and pushing yields a pinned, roll-able image tag —
#                             no separate git tag required.
#   - push of a v* tag      -> tags the semver (e.g. 0.5.1, 0.5, plus latest)
#
# On a v* tag it ALSO publishes the crate to crates.io (so `cargo install
# metalcraft-agent` stays in step with releases). That step needs a
# CARGO_REGISTRY_TOKEN repo secret; it self-skips if the version is already up.
on:
  push:
    branches: [master, sqlite-store]
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # rust4ai/metalcraft-agent

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # required to push to GHCR with GITHUB_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The crate version drives a pinned image tag on master pushes, so the
      # control plane can roll pods to an immutable `:X.Y.Z` (a floating `:latest`
      # can't be "upgraded to" — same tag string, new digest, no rollout).
      - name: Read crate version
        id: ver
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/^version *= *"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.ver.outputs.version }},enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

# (crates.io publish job removed for the fork — metalcraft-agent-r2 is not published to crates.io.)
